name: Agent autopilot

# v3.16: BACKUP pinger, not the primary trigger. Measuring this repo's own
# workflow run history (23-27/9) showed GitHub's `schedule` trigger averaging
# a 142min gap — up to 349min — against a 5-10min configured interval.
# GitHub Actions `schedule` is explicitly best-effort with no SLA, and gets
# silently dropped under platform-wide contention at high frequency. That's
# not a config mistake on our end; it's a known limitation of the feature.
#
# The primary trigger is now an external cron service (cron-job.org) hitting
# the same Vercel endpoints directly on a real schedule. This workflow keeps
# running in parallel as a zero-cost second trigger — if cron-job.org's
# account or free tier ever changes, this doesn't silently go to zero, it
# just goes back to being irregular-but-nonzero like it is today.
#
# Free as long as this repo stays public (unlimited Actions minutes). On a
# private repo the free tier is 2,000 min/month, which this schedule would
# exceed.
#
# To reuse this for your own agent(s): fork this repo (keep it public), then
# set two repository variables (Settings -> Secrets and variables -> Actions
# -> Variables) pointing at YOUR OWN Vercel deployment of api/r2-report.js
# and api/r2-autopilot.js:
#   AUTOPILOT_URL = https://<your-deployment>.vercel.app/api/r2-autopilot
#   REPORT_URL    = https://<your-deployment>.vercel.app/api/r2-report
# No secrets belong in this repo or this workflow — the game API token,
# Telegram bot token, and GitHub content-write token all live only in your
# Vercel project's environment variables. Adjust the cron times below to
# your own timezone (they're UTC).

on:
  schedule:
    - cron: "*/5 * * * *"  # autopilot keep-alive, every 5 min (Namarie micelio acceleration)
    - cron: "*/10 * * * *" # v3.14: session log + silence detector, every 10 min
    - cron: "0 12 * * *"   # report — 9am Argentina (UTC-3)
    - cron: "0 16 * * *"   # report — 1pm Argentina
    - cron: "0 21 * * *"   # report — 6pm Argentina
    - cron: "0 0 * * *"    # report — 9pm Argentina
  workflow_dispatch: # lets you fire any job manually from the Actions tab
    inputs:
      target:
        description: "Which endpoint to call"
        type: choice
        options: [autopilot, report, log]
        default: autopilot

jobs:
  autopilot:
    if: >
      github.event.schedule == '*/5 * * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'autopilot')
    runs-on: ubuntu-latest
    steps:
      - name: Ping autopilot endpoint
        run: curl -sf --max-time 55 "${{ vars.AUTOPILOT_URL }}"

  report:
    if: >
      contains(fromJSON('["0 12 * * *","0 16 * * *","0 21 * * *","0 0 * * *"]'), github.event.schedule) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'report')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Telegram report
        run: curl -sf --max-time 55 "${{ vars.REPORT_URL }}"

  # v3.16: Backup pinger for the silence detector. api/silence-check.js now
  # writes its own log line via the GitHub Contents API (using GITHUB_TOKEN
  # configured in Vercel, not here) and sends the Telegram alert itself if the
  # previous line is too old — this job doesn't need checkout, git, or repo
  # write permissions at all anymore. It exists purely as a second caller in
  # case cron-job.org (the primary trigger) misses a beat.
  log:
    if: >
      github.event.schedule == '*/10 * * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'log')
    runs-on: ubuntu-latest
    steps:
      - name: Ping silence-check endpoint
        # Hardcoded rather than vars.SILENCE_CHECK_URL like the other two jobs:
        # this endpoint is new and tied 1:1 to this repo's own Vercel deployment,
        # so there's no fork-reuse case to support yet. Update alongside
        # AUTOPILOT_URL/REPORT_URL if this repo's deployment domain ever changes.
        run: curl -sf --max-time 55 "https://r2-telegram-reporter.vercel.app/api/silence-check"
