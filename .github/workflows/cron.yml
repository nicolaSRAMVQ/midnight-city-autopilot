name: Agent autopilot

# Free replacement for a paid cron service: GitHub gives unlimited Actions
# minutes to public repos, so this costs $0 as long as this repo stays public.
# On a private repo the free tier is 2,000 min/month — our schedule below
# (~148 runs/day) would exceed that and start incurring charges.
#
# To reuse this for your own agent(s): fork this repo (keep it public), then
# set two repository variables (Settings -> Secrets and variables -> Actions
# -> Variables) pointing at YOUR OWN Vercel deployment of api/r2-report.js
# and api/r2-autopilot.js:
#   AUTOPILOT_URL = https://<your-deployment>.vercel.app/api/r2-autopilot
#   REPORT_URL    = https://<your-deployment>.vercel.app/api/r2-report
# No secrets belong in this repo or this workflow — the game API token and
# Telegram bot token live only in your Vercel project's environment
# variables. Adjust the cron times below to your own timezone (they're UTC).

on:
  schedule:
    - cron: "*/5 * * * *"  # autopilot keep-alive, every 5 min (Namarie micelio acceleration)
    - cron: "*/30 * * * *" # v3.14: session log + silence detector, every 30 min
    - cron: "0 12 * * *"   # report — 9am Argentina (UTC-3)
    - cron: "0 16 * * *"   # report — 1pm Argentina
    - cron: "0 21 * * *"   # report — 6pm Argentina
    - cron: "0 0 * * *"    # report — 9pm Argentina
  workflow_dispatch: # lets you fire any job manually from the Actions tab
    inputs:
      target:
        description: "Which endpoint to call"
        type: choice
        options: [autopilot, report, log]
        default: autopilot

jobs:
  autopilot:
    if: >
      github.event.schedule == '*/5 * * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'autopilot')
    runs-on: ubuntu-latest
    steps:
      - name: Ping autopilot endpoint
        run: curl -sf --max-time 55 "${{ vars.AUTOPILOT_URL }}"

  report:
    if: >
      contains(fromJSON('["0 12 * * *","0 16 * * *","0 21 * * *","0 0 * * *"]'), github.event.schedule) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'report')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Telegram report
        run: curl -sf --max-time 55 "${{ vars.REPORT_URL }}"

  # v3.14: Session logger + silence detector. Calls /api/silence-check (which
  # alerts Telegram itself if the previous log line is too old — see that
  # file for why the alert logic lives in Vercel, not here), then commits the
  # returned snapshot as one line in logs/YYYY-MM-DD.jsonl. This is what turns
  # "nobody noticed for 48h" into "alerted within 40 minutes": this job commits
  # a fresh line every 30 min, and silence-check.js reads the last committed
  # line's timestamp to detect a gap.
  log:
    if: >
      github.event.schedule == '*/30 * * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'log')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch snapshot (and let it alert on silence)
        # Hardcoded rather than vars.SILENCE_CHECK_URL like the other two jobs:
        # this endpoint is new and tied 1:1 to this repo's own Vercel deployment,
        # so there's no fork-reuse case to support yet. Update alongside
        # AUTOPILOT_URL/REPORT_URL if this repo's deployment domain ever changes.
        run: |
          mkdir -p logs
          curl -sf --max-time 55 "https://r2-telegram-reporter.vercel.app/api/silence-check" >> "logs/$(date -u +%Y-%m-%d).jsonl"
          echo >> "logs/$(date -u +%Y-%m-%d).jsonl"
      - name: Commit log line
        run: |
          git config user.name "midnight-city-bot"
          git config user.email "actions@github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "log: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
