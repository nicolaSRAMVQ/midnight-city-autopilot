<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero Midnight</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#07080d;--card:#11131c;--line:#22263a;--tx:#e8eaf4;--mut:#8a90a8;--up:#3ddc84;--down:#ff5c6c;--r2:#4da3ff;--bb8:#ffad33;--c3:#c792ff;--acc:#7cf0d0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:980px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:.5px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut);margin:28px 0 10px;font-weight:600}
.sub{color:var(--mut);font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.drow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:700;font-size:18px}
.rank{font-size:34px;font-weight:800;line-height:1}
.deltas{display:flex;gap:6px;margin:10px 0}
.delta{flex:1;background:#0b0d14;border-radius:10px;padding:6px 4px;text-align:center}
.delta b{display:block;font-size:15px}
.delta span{font-size:11px;color:var(--mut)}
.up{color:var(--up)}.down{color:var(--down)}.eq{color:var(--mut)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--mut)}
.bar{height:8px;background:#0b0d14;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;border-radius:6px}
.gap{font-size:12.5px;color:var(--mut);margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{background:#0b0d14;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px}
.tabs button.on{color:var(--tx);border-color:var(--acc)}
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
.scroll{overflow-x:auto}
.charts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.charts h3{margin:0 0 2px;font-size:15px}
.charts .now{font-size:12.5px;color:var(--mut);margin-bottom:6px}
.chartbox{width:100%}
.phase{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.phase b{min-width:22px;color:var(--acc)}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
#err{color:var(--down)}
</style>
</head>
<body>
<h1>🌃 Tablero Midnight</h1>
<div class="sub" id="upd">Cargando…</div>
<div id="err"></div>

<h2>🏁 Ranking y carrera</h2>
<div class="grid" id="cards"></div>

<h2>📈 Gráficos</h2>
<div class="tabs" id="ranges"></div>
<div class="legend" id="legend" style="margin:-2px 0 10px"></div>
<div class="charts" id="charts"></div>

<h2>🔧 Boxes, últimos días</h2>
<div class="card scroll" id="boxes"></div>

<h2>🧪 Prueba de ventas (desde 11/10)</h2>
<div class="card" id="test"></div>

<h2>📚 Historial de experimentos</h2>
<div class="card" id="phases"></div>

<script>
const API = "/api/agent-status?view=dashboard";
const COLORS = { "R2": "var(--r2)", "BB-8": "var(--bb8)", "C-3PO": "var(--c3)" };
const ORDER = ["R2", "BB-8", "C-3PO"];
const TEST_START = Date.parse("2026-10-11T04:44:00Z");
// Línea base de la prueba: % trabajando medido antes de v3.30 (24 h al 10/10).
const BASE_WORK = { "R2": 76.3, "BB-8": 62.4, "C-3PO": 63.4 };
const nf = (n, d = 0) => n == null || isNaN(n) ? "–" : Number(n).toLocaleString("es-AR", { maximumFractionDigits: d, minimumFractionDigits: d });
const short = (n) => n == null ? "–" : Math.abs(n) >= 1e6 ? nf(n / 1e6, 2) + " M" : Math.abs(n) >= 1e4 ? nf(n / 1e3, 1) + " k" : nf(n);
const fmtDate = (d) => { const [, m, day] = d.split("-"); return `${+day}/${+m}`; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function rankAt(ranks, agent, msAgo, fallback = false) {
  const target = Date.now() - msAgo;
  const mine = ranks.filter((r) => r.agent === agent);
  if (!mine.length) return null;
  let best = null;
  for (const r of mine) { if (Date.parse(r.at) <= target) best = r; }
  if (best) return { ...best, exact: true };
  const first = mine[0]; // historial más corto que el período pedido
  return fallback && Date.now() - Date.parse(first.at) > 3 * 36e5 ? { ...first, exact: false } : null;
}

function deltaBox(now, past, label) {
  if (!now || !past) return `<div class="delta"><b class="eq">–</b><span>${label}</span></div>`;
  const diff = past.rank - now; // positivo = subió
  const pct = (Math.abs(diff) / past.rank) * 100;
  const cls = diff > 0 ? "up" : diff < 0 ? "down" : "eq";
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "=";
  const hours = (Date.now() - Date.parse(past.at)) / 36e5;
  const lab = past.exact ? label : hours < 24 ? `${Math.round(hours)} h*` : `${Math.round(hours / 24)} d*`;
  return `<div class="delta"><b class="${cls}">${arrow}${diff ? Math.abs(diff) : ""}</b><span>${diff ? nf(pct, 1) + " % · " : ""}${lab}</span></div>`;
}

function card(a, days, ranks) {
  const mine = days.filter((d) => d.agent === a.name);
  const full = mine.slice(0, -1).slice(-3); // últimos días completos
  const xpDay = full.length > 1 ? (full.at(-1).xp - full[0].xp) / (full.length - 1) : null;
  const crDay = full.length > 1 ? (full.at(-1).crystal - full[0].crystal) / (full.length - 1) : null;
  const toLevel = a.nextLevelXp != null ? a.nextLevelXp - a.xp : null;
  const eta = xpDay > 0 && toLevel > 0 ? toLevel / xpDay : null;
  const b = a.board || {};
  const now = b.rank;
  const pctLevel = a.nextLevelXp ? Math.min(100, (a.xp / a.nextLevelXp) * 100) : 0;
  const gapAhead = b.ahead && b.xp != null ? b.ahead.xp - b.xp : null;
  const gapBehind = b.behind && b.xp != null ? b.xp - b.behind.xp : null;
  const passDays = gapAhead > 0 && xpDay > 0 ? gapAhead / xpDay : null;
  const state = a.error ? "⚠️ sin lectura" : a.working ? "⚒️ trabajando" : "🏕️ parado";
  return `<div class="card">
    <div class="drow"><span class="name" style="color:${COLORS[a.name]}">${esc(a.name)}</span><span class="sub">${state}</span></div>
    <div class="drow" style="margin-top:6px"><span class="rank">${now ? "#" + now : "–"}</span><span class="sub">${TOTAL && now ? `de ${nf(TOTAL)} · top ${Math.max(1, Math.round((now / TOTAL) * 100))} %` : "ranking XP"}</span></div>
    <div class="deltas">${deltaBox(now, rankAt(ranks, a.name, 864e5, true), "1 día")}${deltaBox(now, rankAt(ranks, a.name, 7 * 864e5), "7 días")}${deltaBox(now, rankAt(ranks, a.name, 30 * 864e5), "30 días")}</div>
    <div class="kv"><span>${esc(a.skill)} → L${(a.level ?? 0) + 1}</span><span>${nf(pctLevel, 1)} %</span></div>
    <div class="bar"><i style="width:${pctLevel}%;background:${COLORS[a.name]}"></i></div>
    <div class="kv">
      <span>Falta para subir</span><span>${short(toLevel)} xp</span>
      <span>Llega en</span><span>${eta == null ? "–" : eta < 1 ? "menos de 1 día" : "~" + nf(eta, 1) + " días"}</span>
      <span>XP por día</span><span>${short(xpDay)}</span>
      <span>Crystals</span><span>💎 ${nf(a.crystals)}</span>
      <span>Crystals por día</span><span>${crDay == null ? "–" : (crDay >= 0 ? "+" : "") + nf(crDay)}</span>
      <span>Hambre · carga</span><span>🥤 ${nf(a.hunger)} · ⚖️ ${nf(a.speed)} %</span>
    </div>
    <div class="gap">${b.ahead ? `⬆️ #${b.ahead.rank} ${esc(b.ahead.name)}: a ${short(gapAhead)} xp${passDays ? ` (lo pasa en ${passDays * 24 < 1 ? "menos de 1 h" : passDays < 1 ? "~" + nf(passDays * 24) + " h" : "~" + nf(passDays, 1) + " d"})` : ""}` : ""}
      ${b.behind ? `<br>⬇️ #${b.behind.rank} ${esc(b.behind.name)}: ${short(gapBehind)} xp atrás` : ""}</div>
  </div>`;
}

// Gráficos (v3.33): varios a la vista. Cada uno es una serie por droide sobre un eje
// de días (o de horas, para el puesto) y se dibuja como líneas o barras agrupadas.
const RANGES = { "24h": { label: "24 h", hours: 24 }, "48h": { label: "48 h", hours: 48 }, "7d": { label: "7 días", days: 7 }, "30d": { label: "30 días", days: 30 }, all: { label: "Todo" } };
let RANGE = (() => { try { return localStorage.getItem("mc-range") || "7d"; } catch { return "7d"; } })();
if (!RANGES[RANGE]) RANGE = "7d";

function daily(days, f, { delta = false, complete = false, window = null } = {}) {
  let dates = [...new Set(days.map((d) => d.date))].sort();
  if (window) dates = dates.slice(-(window + (delta ? 1 : 0) + (complete ? 1 : 0)));
  const series = ORDER.map((agent) => {
    const by = Object.fromEntries(days.filter((d) => d.agent === agent).map((d) => [d.date, d]));
    return { agent, vals: dates.map((dt, i) => { const d = by[dt]; if (!d) return null; if (!delta) return f(d); const p = by[dates[i - 1]]; return p ? f(d) - f(p) : null; }) };
  });
  if (complete) { dates = dates.slice(0, -1); series.forEach((s) => s.vals.pop()); } // hoy va en curso
  if (delta) { dates = dates.slice(1); series.forEach((s) => s.vals.shift()); }
  return { xs: dates.map(fmtDate), series };
}

// Hora por hora (últimas 24 o 48 h): mismo formato que daily().
const hourLabel = (iso) => { const p = Object.fromEntries(new Intl.DateTimeFormat("es-AR", { timeZone: "America/Argentina/Buenos_Aires", day: "numeric", month: "numeric", hour: "2-digit", hourCycle: "h23" }).formatToParts(new Date(iso)).map((x) => [x.type, x.value])); return `${p.day}/${p.month} ${p.hour}h`; };
function hourly(hours, f, { delta = false, back = 24 } = {}) {
  const since = Date.now() - (back + (delta ? 1 : 0)) * 36e5;
  let hs = [...new Set(hours.map((h) => h.at))].filter((h) => Date.parse(h) >= since).sort();
  const series = ORDER.map((agent) => {
    const by = Object.fromEntries(hours.filter((h) => h.agent === agent).map((h) => [h.at, h]));
    return { agent, vals: hs.map((t, i) => { const d = by[t]; if (!d) return null; if (!delta) return f(d); const p = by[hs[i - 1]]; return p ? f(d) - f(p) : null; }) };
  });
  if (delta) { hs = hs.slice(1); series.forEach((s) => s.vals.shift()); }
  return { xs: hs.map(hourLabel), series };
}

function hourlyRanks(ranks, backHours = null, raw = false) {
  if (backHours) ranks = ranks.filter((r) => Date.parse(r.at) >= Date.now() - backHours * 36e5);
  const hours = [...new Set(ranks.map((r) => r.at.slice(0, 13)))].sort();
  const label = (h) => hourLabel(h + ":00:00Z");
  return {
    xs: hours.map(label),
    series: ORDER.map((agent) => {
      const mine = ranks.filter((r) => r.agent === agent);
      const first = mine[0]?.rank;
      const by = Object.fromEntries(mine.map((r) => [r.at.slice(0, 13), raw ? r.rank : first - r.rank])); // puesto o puestos ganados
      return { agent, vals: hours.map((h) => by[h] ?? null) };
    }),
  };
}

function chart({ xs, series }, { kind = "line", fmt = short, invert = false, range = null, width, height = 220 }) {
  const all = series.flatMap((s) => s.vals).filter((v) => v != null);
  if (all.length < 2 || xs.length < 2) return `<p class="sub">Todavía no hay suficientes datos. Se va llenando solo.</p>`;
  const W = Math.max(300, Math.min(640, width || 640)), H = height, L = 50, R = 10, T = 10, B = 26;
  let [lo, hi] = range ?? [Math.min(...all), Math.max(...all)];
  if (kind === "bar") lo = Math.min(0, lo);
  if (hi === lo) { hi += 1; lo -= 1; }
  const n = xs.length, slot = (W - L - R) / n;
  const x = (i) => (kind === "bar" ? L + slot * (i + 0.5) : L + (n === 1 ? 0 : (i * (W - L - R)) / (n - 1)));
  const y = (v) => { const t = (v - lo) / (hi - lo); return invert ? T + t * (H - T - B) : H - B - t * (H - T - B); };
  let g = "";
  const gridN = height < 180 ? 2 : 4;
  for (let k = 0; k <= gridN; k++) {
    const v = lo + ((hi - lo) * k) / gridN, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#22263a"/><text x="${L - 6}" y="${yy + 4}" fill="#8a90a8" font-size="11" text-anchor="end">${fmt(v)}</text>`;
  }
  const maxTicks = Math.max(3, Math.floor((W - L - R) / (Math.max(...xs.map((d) => String(d).length)) * 7 + 10)));
  const step = Math.ceil(n / maxTicks);
  xs.forEach((d, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    if (i !== n - 1 && n - 1 - i < step) return; // no pisar la última etiqueta
    const anchor = kind === "bar" ? "middle" : i === 0 ? "start" : i === n - 1 ? "end" : "middle";
    g += `<text x="${x(i)}" y="${H - 7}" fill="#8a90a8" font-size="10.5" text-anchor="${anchor}">${esc(d)}</text>`;
  });
  series.forEach((s, si) => {
    const c = COLORS[s.agent];
    if (kind === "bar") {
      const bw = (slot * 0.8) / series.length;
      s.vals.forEach((v, i) => { if (v == null) return; const x0 = L + slot * i + slot * 0.1 + bw * si, y0 = y(Math.max(v, 0)), y1 = y(Math.min(v, 0)); g += `<rect x="${x0}" y="${y0}" width="${Math.max(1, bw - 1)}" height="${Math.max(1, y1 - y0)}" rx="2" fill="${c}"><title>${s.agent} ${esc(xs[i])}: ${fmt(v)}</title></rect>`; });
    } else {
      const pts = s.vals.map((v, i) => (v == null ? null : [x(i), y(v)])).filter(Boolean);
      if (!pts.length) return;
      g += `<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p) => p.join(",")).join(" ")}"/>`;
      if (pts.length <= 40) g += pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${c}"/>`).join("");
    }
  });
  return `<svg class="chartbox" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

// Puesto real de cada droide, cada uno con su propia escala (están en zonas muy
// distintas del ranking, y en una escala común las tres líneas salen planas).
function rankCard(ranks, back, width) {
  const data = hourlyRanks(ranks, back, true);
  const parts = data.series.map((s) => {
    const vals = s.vals.filter((v) => v != null);
    if (vals.length < 2) return "";
    const first = vals[0], last = vals.at(-1), best = Math.min(...vals), diff = first - last;
    const head = `<div class="now"><b style="color:${COLORS[s.agent]}">${s.agent}</b> de #${nf(first)} a <b>#${nf(last)}</b> <span class="${diff > 0 ? "up" : diff < 0 ? "down" : "eq"}">${diff > 0 ? "▲" : diff < 0 ? "▼" : "="}${diff ? Math.abs(diff) : ""}</span> · mejor #${nf(best)}</div>`;
    return head + chart({ xs: data.xs, series: [s] }, { invert: true, fmt: (v) => "#" + nf(v), width, height: 130 });
  }).join("");
  return `<div class="card"><h3>Puesto en el ranking</h3>${parts || '<p class="sub">Todavía no hay suficientes datos.</p>'}<div class="note">Hora por hora; arriba es mejor. Cada droide tiene su propia escala. El registro de puestos empezó el 11/10 a la madrugada; antes de eso el juego no guarda historial.</div></div>`;
}

// Último valor de cada droide, para leer el gráfico sin tocarlo.
const latest = ({ series }, fmt) => series.map((s) => { const v = [...s.vals].reverse().find((x) => x != null); return `<span style="color:${COLORS[s.agent]}">${s.agent} ${v == null ? "–" : fmt(v)}</span>`; }).join(" · ");

function drawCharts() {
  const days = DATA.history.days || [], ranks = DATA.history.ranks || [];
  const width = (document.getElementById("charts").clientWidth || 640) - 30;
  const trips = (d) => d.sell_overload + d.sell_liquidity;
  const pctFmt = (v) => nf(v) + " %";
  const r = RANGES[RANGE];
  const hoursData = DATA.history.hours || [];
  const rankBack = r.hours ?? (r.days ? r.days * 24 : null);
  const since = r.hours ? `en las últimas ${r.hours} h` : r.days ? `en los últimos ${r.days} días` : "desde el 11/10";
  const specs = r.hours
    ? [
        { title: "Experiencia del oficio", note: "XP acumulada, hora por hora.", data: hourly(hoursData, (d) => d.xp, { back: r.hours }), opt: {} },
        { title: "XP ganada por hora", note: "Cuánto sumó cada hora.", data: hourly(hoursData, (d) => d.xp, { delta: true, back: r.hours }), opt: { kind: "bar" } },
        { title: "Puestos ganados en el ranking", note: `Contra el primer registro ${since}. Arriba es mejor.`, data: hourlyRanks(ranks, rankBack), opt: { fmt: (v) => (v > 0 ? "+" : "") + nf(v) } },
        { title: "Crystals", note: "Lo que tiene guardado cada uno.", data: hourly(hoursData, (d) => d.crystal, { back: r.hours }), opt: {} },
        { title: "Crystals ganados por hora", note: "Las caídas son compras (comida, herramientas).", data: hourly(hoursData, (d) => d.crystal, { delta: true, back: r.hours }), opt: { kind: "bar" } },
        { title: "% de la hora trabajando", note: "Medido cada 10 minutos.", data: hourly(hoursData, (d) => d.working_pct, { back: r.hours }), opt: { range: [0, 100], fmt: pctFmt } },
        { title: "Viajes a vender por hora", note: "Por peso o por falta de crystals.", data: hourly(hoursData, (d) => d.trips, { back: r.hours }), opt: { kind: "bar", fmt: nf } },
      ]
    : [
        { title: "Experiencia del oficio", note: "XP acumulada en la profesión principal.", data: daily(days, (d) => d.xp, { window: r.days }), opt: {} },
        { title: "XP ganada por día", note: "Días completos, de cierre a cierre.", data: daily(days, (d) => d.xp, { delta: true, complete: true, window: r.days }), opt: { kind: "bar" } },
        { title: "Puestos ganados en el ranking", note: `Hora por hora, contra el primer registro ${since}. Arriba es mejor.`, data: hourlyRanks(ranks, rankBack), opt: { fmt: (v) => (v > 0 ? "+" : "") + nf(v) } },
        { title: "Crystals", note: "Lo que tiene guardado cada uno.", data: daily(days, (d) => d.crystal, { window: r.days }), opt: {} },
        { title: "Crystals ganados por día", note: "Días completos.", data: daily(days, (d) => d.crystal, { delta: true, complete: true, window: r.days }), opt: { kind: "bar" } },
        { title: "% del día trabajando", note: "Medido cada 10 minutos.", data: daily(days, (d) => d.working_pct, { window: r.days }), opt: { range: [0, 100], fmt: pctFmt } },
        { title: "Viajes a vender por día", note: "Por peso o por falta de crystals. Menos es mejor.", data: daily(days, trips, { complete: true, window: r.days }), opt: { kind: "bar", fmt: nf } },
      ];
  document.getElementById("ranges").innerHTML = Object.entries(RANGES).map(([k, v]) => `<button data-r="${k}" class="${k === RANGE ? "on" : ""}">${v.label}</button>`).join("");
  document.querySelectorAll("#ranges button").forEach((b) => (b.onclick = () => { RANGE = b.dataset.r; try { localStorage.setItem("mc-range", RANGE); } catch {} drawCharts(); }));
  document.getElementById("charts").innerHTML = rankCard(ranks, rankBack, width) + specs.map((c) => `<div class="card"><h3>${c.title}</h3><div class="now">${latest(c.data, c.opt.fmt || short)}</div>${chart(c.data, { ...c.opt, width })}<div class="note">${c.note}</div></div>`).join("");
}

function boxesTable(days) {
  const dates = [...new Set(days.map((d) => d.date))].sort().slice(-7).reverse();
  let h = `<table><tr><th>Día</th>${ORDER.map((a) => `<th style="color:${COLORS[a]}">${a}</th>`).join("")}</tr>`;
  for (const dt of dates) {
    h += `<tr><td>${fmtDate(dt)}</td>`;
    for (const a of ORDER) {
      const d = days.find((x) => x.agent === a && x.date === dt);
      h += d ? `<td>${nf(d.working_pct)} % · 🛒${d.sell_overload + d.sell_liquidity}${d.tool_trips ? ` · 🪓${d.tool_trips}` : ""}${d.errors ? ` · ⚠️${d.errors}` : ""}</td>` : "<td>–</td>";
    }
    h += "</tr>";
  }
  return h + `</table><p class="note">% del día trabajando · 🛒 viajes a vender (por peso o por falta de crystals) · 🪓 viajes a comprar herramienta · ⚠️ ciclos con error. El día de hoy va en curso.</p>`;
}

function testBlock(days) {
  const before = (a) => days.filter((d) => d.agent === a && d.date >= "2026-10-08" && d.date <= "2026-10-10");
  const after = (a) => days.filter((d) => d.agent === a && Date.parse(d.date + "T23:59:59-03:00") > TEST_START);
  const avg = (arr, f) => (arr.length ? arr.reduce((s, d) => s + f(d), 0) / arr.length : null);
  const perDay = (arr) => {
    const tot = arr.reduce((s, d) => s + d.samples, 0);
    return tot ? (arr.reduce((s, d) => s + d.sell_overload + d.sell_liquidity, 0) * 144) / tot : null;
  };
  const elapsed = (Date.now() - TEST_START) / 864e5;
  let h = `<p class="sub">Regla nueva: solo vende por falta de liquidez si le quedan menos de 1.000 crystals. Llevamos ${nf(Math.max(0, elapsed), 1)} de 7 días.</p>
  <table><tr><th></th><th>% trabajando antes</th><th>ahora</th><th>viajes/día antes</th><th>ahora</th></tr>`;
  for (const a of ORDER) {
    const b = before(a), n = after(a);
    const wNow = n.length ? avg(n, (d) => d.working_pct * d.samples) / avg(n, (d) => d.samples) : null;
    const diff = wNow != null ? wNow - BASE_WORK[a] : null;
    h += `<tr><td style="color:${COLORS[a]}">${a}</td><td>${nf(BASE_WORK[a], 1)} %</td><td class="${diff == null ? "" : diff >= 0 ? "up" : "down"}">${wNow == null ? "–" : nf(wNow, 1) + " %"}</td><td>${nf(perDay(b), 0)}</td><td>${nf(perDay(n), 0)}</td></tr>`;
  }
  return h + `</table><p class="note">Las primeras horas mueven mucho el número; se lee en serio a partir del tercer día. Informe final el sábado 18/10.</p>`;
}

function phasesBlock(phases) {
  const RESULT = { A: "la peor: entrenaba sin parar y casi no trabajaba", B: "mejor, pero las pausas cortaban el trabajo", C: "buena para crystals de R2", D: "ganadora: más XP y más crystals", E: "regla vigente" };
  return phases.map((p) => {
    const f = (s) => new Date(s).toLocaleDateString("es-AR", { day: "numeric", month: "numeric" });
    const live = Date.now() >= Date.parse(p.starts_at) && Date.now() < Date.parse(p.ends_at);
    return `<div class="phase"><b>${esc(p.id)}</b><div>${esc(p.label)}<div class="sub">${f(p.starts_at)}${p.id === "E" ? " en adelante" : " a " + f(p.ends_at)} · ${RESULT[p.id] ?? ""}${live ? " · 🟢 ahora" : ""}</div></div></div>`;
  }).join("");
}

let DATA = null, TOTAL = null;

async function load() {
  try {
    const r = await fetch(API, { cache: "no-store" });
    DATA = await r.json();
    const h = DATA.history || {};
    if (h.error) throw new Error(h.error);
    const days = h.days || [], ranks = h.ranks || [];
    TOTAL = DATA.totalAgents;
    const live = ORDER.map((n) => DATA.live.find((a) => a.name === n)).filter(Boolean);
    document.getElementById("cards").innerHTML = live.map((a) => card(a, days, ranks)).join("");
    document.getElementById("legend").innerHTML = ORDER.map((a) => `<span><i style="background:${COLORS[a]}"></i>${a}</span>`).join("");
    drawCharts();
    document.getElementById("boxes").innerHTML = boxesTable(days);
    document.getElementById("test").innerHTML = testBlock(days);
    document.getElementById("phases").innerHTML = phasesBlock(h.phases || []);
    const t = new Date(DATA.timestamp).toLocaleString("es-AR", { timeZone: "America/Argentina/Buenos_Aires", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
    document.getElementById("upd").textContent = `Datos en vivo de ${t} · se actualiza solo cada 5 minutos · * = historial más corto que el período`;
  } catch (e) {
    document.getElementById("err").textContent = "No pude leer los datos ahora. Probá recargar en un rato.";
  }
}
load();
setInterval(load, 5 * 60e3);
</script>
